name: Mawja V25 Final APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct V25 source
        shell: bash
        run: |
          set -euo pipefail
          cat .mawja-source/raw-01.b64 .mawja-source/raw-02.b64 .mawja-source/raw-03.b64 .mawja-source/raw-04.b64 .mawja-source/raw-05.b64 .mawja-source/raw-06.b64 .mawja-source/raw-07.b64 > source.b64
          python3 - <<'PY'
          import base64, hashlib
          s=b"".join(open("source.b64","rb").read().split())
          assert len(s)==46252, len(s)
          raw=base64.b64decode(s, validate=True)
          assert hashlib.sha256(raw).hexdigest()=="41d0352980313a932652af1d1d13243ca52fd26a29ad9c8ad15a7e4e810f5bc6"
          open("source.zip","wb").write(raw)
          PY
          unzip -tq source.zip
          rm -rf src
          mkdir src
          unzip -q source.zip -d src
          rsync -a src/ ./
          test -f app/build.gradle.kts
          test -f app/google-services.json

      - name: Install Android SDK
        run: |
          set -e
          yes | "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Patch build configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s=s.replace("compileSdk = 35","compileSdk = 36")
          s=s.replace("compileSdk 35","compileSdk 36")
          s=s.replace("JavaVersion.VERSION_1_8","JavaVersion.VERSION_17")
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s += '''
          
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          
          kotlin {
              jvmToolchain(17)
          }
          '''
          p.write_text(s)

          p=Path("app/src/main/java/com/mawja/app/data/MawjaRepository.kt")
          s=p.read_text()
          s=s.replace("import io.github.jan.supabase.auth.providers.Email","import io.github.jan.supabase.auth.providers.builtin.Email")
          if "import io.github.jan.supabase.auth.auth" not in s:
              s=s.replace("import io.github.jan.supabase.auth.providers.builtin.Email","import io.github.jan.supabase.auth.auth\nimport io.github.jan.supabase.auth.providers.builtin.Email")
          if "import io.github.jan.supabase.postgrest.postgrest" not in s:
              s=s.replace("import io.github.jan.supabase.postgrest.from","import io.github.jan.supabase.postgrest.from\nimport io.github.jan.supabase.postgrest.postgrest")
          if "import io.github.jan.supabase.functions.functions" not in s:
              s=s.replace("import io.github.jan.supabase.functions.invoke","import io.github.jan.supabase.functions.functions\nimport io.github.jan.supabase.functions.invoke")
          if "import io.ktor.client.call.body" not in s:
              s=s.replace("import kotlinx.serialization.json.JsonObject","import io.ktor.client.call.body\nimport kotlinx.serialization.json.JsonObject")
          p.write_text(s)

          # Avoid Kotlin 2.2 generic inference failure on update calls by decoding explicit Unit.
          s=s.replace('client.postgrest.from("profiles").update(buildJsonObject { put("name", name) }) { filter { eq("id", id) } }',
                      'client.postgrest.from("profiles").update(buildJsonObject { put("name", name) }) { filter { eq("id", id) } }.decodeSingle<Unit>()')

          p=Path("app/src/main/java/com/mawja/app/MainActivity.kt")
          s=p.read_text()
          s=s.replace("unreadNotifications = state.notifications.count { !it.is_read },","unreadNotifications = state.notifications.count { !it.is_read }.toLong(),")
          s=s.replace('Text(name, fontWeight = FontWeight.Bold, Modifier.weight(1f))','Text(name, modifier = Modifier.weight(1f), fontWeight = FontWeight.Bold)')
          s=s.replace('Text(title, fontSize = 18.sp, fontWeight = FontWeight.Bold, Modifier.weight(1f))','Text(title, modifier = Modifier.weight(1f), fontSize = 18.sp, fontWeight = FontWeight.Bold)')
          s=s.replace('Text(n.title, fontWeight = FontWeight.Bold, Modifier.weight(1f))','Text(n.title, modifier = Modifier.weight(1f), fontSize = 16.sp, fontWeight = FontWeight.Bold)')
          if "fun ChallengeRow(" not in s:
              marker="@Composable fun RankRow(name: String, score: String) {"
              insert='''@Composable
          fun ChallengeRow(title: String, score: String, onBuzz: () -> Unit) {
              Card(colors = CardDefaults.cardColors(containerColor = Surface), shape = RoundedCornerShape(18.dp), modifier = Modifier.fillMaxWidth()) {
                  Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Text(title, fontWeight = FontWeight.Bold)
                          Text("النتيجة: $score", color = Color.Gray, fontSize = 12.sp)
                      }
                      FilledTonalButton(onClick = onBuzz) {
                          Icon(Icons.Default.Bolt, contentDescription = null)
                          Spacer(Modifier.width(5.dp))
                          Text("Buzz")
                      }
                  }
              }
          }

          '''
              if marker not in s: raise SystemExit("ChallengeRow marker missing")
              s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          PY

      - name: Apply final V25 compile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/v25_final_fix.py

          # Supabase Functions invoke is an extension and must remain imported after final fix.
          p=Path("app/src/main/java/com/mawja/app/data/MawjaRepository.kt")
          s=p.read_text()
          if "import io.github.jan.supabase.functions.invoke" not in s:
              s=s.replace("import io.github.jan.supabase.functions.functions", "import io.github.jan.supabase.functions.functions\nimport io.github.jan.supabase.functions.invoke")
          p.write_text(s)

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        run: |
          set -o pipefail
          set +e
          gradle --no-daemon --stacktrace clean assembleRelease 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "===== COMPILER ERROR SUMMARY ====="
          grep -E "e: |error:|Unresolved reference|Cannot infer|Type mismatch|Compilation error" build.log | tail -n 120 || true
          echo "===== END COMPILER ERROR SUMMARY ====="
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$APK"
          test -s "$APK"
          cp "$APK" Mawja-V25-release.apk
          sha256sum Mawja-V25-release.apk > Mawja-V25-release.apk.sha256
          unzip -tq Mawja-V25-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-V25-release
          path: |
            Mawja-V25-release.apk
            Mawja-V25-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

name: Mawja V25 Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild V25 source
        shell: bash
        run: |
          set -euo pipefail
          cat .mawja-source/raw-01.b64               .mawja-source/raw-02.b64               .mawja-source/raw-03.b64               .mawja-source/raw-04.b64               .mawja-source/raw-05.b64               .mawja-source/raw-06.b64               .mawja-source/raw-07.b64 > source.b64
          python3 - <<'PY'
          import base64, hashlib
          s=b"".join(open("source.b64","rb").read().split())
          assert len(s)==46252, len(s)
          raw=base64.b64decode(s, validate=True)
          h=hashlib.sha256(raw).hexdigest()
          print("ZIP_SHA256=",h)
          assert h=="41d0352980313a932652af1d1d13243ca52fd26a29ad9c8ad15a7e4e810f5bc6"
          open("source.zip","wb").write(raw)
          PY
          unzip -tq source.zip
          rm -rf src
          mkdir src
          unzip -q source.zip -d src
          rsync -a src/ ./
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Patch V25 source for current SDK APIs
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/compileSdk = 35/compileSdk = 36/' app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path

          repo=Path("app/src/main/java/com/mawja/app/data/MawjaRepository.kt")
          s=repo.read_text()
          needed=[
              "import io.github.jan.supabase.auth.auth",
              "import io.github.jan.supabase.postgrest.postgrest",
              "import io.github.jan.supabase.functions.functions",
          ]
          for imp in reversed(needed):
              if imp not in s:
                  s=imp+"\n"+s
          s=s.replace("import io.github.jan.supabase.auth.providers.Email", "import io.github.jan.supabase.auth.providers.builtin.Email")
          s=s.replace("import io.github.jan.supabase.functions.invoke\n", "")
          repo.write_text(s)

          main=Path("app/src/main/java/com/mawja/app/MainActivity.kt")
          s=main.read_text()
          s=s.replace("unreadMessages = state.unreadMessages,", "unreadMessages = state.unreadMessages,")
          s=s.replace("unreadNotifications = state.notifications.count { !it.is_read },", "unreadNotifications = state.notifications.count { !it.is_read }.toLong(),")
          s=s.replace('Text(name, fontWeight = FontWeight.Bold, Modifier.weight(1f))', 'Text(name, modifier = Modifier.weight(1f), fontWeight = FontWeight.Bold)')
          s=s.replace('Text(title, fontSize = 18.sp, fontWeight = FontWeight.Bold, Modifier.weight(1f))', 'Text(title, modifier = Modifier.weight(1f), fontSize = 18.sp, fontWeight = FontWeight.Bold)')
          s=s.replace('Text(n.title, fontWeight = FontWeight.Bold, Modifier.weight(1f))', 'Text(n.title, modifier = Modifier.weight(1f), fontWeight = FontWeight.Bold)')
          if 'fun ChallengeRow(' not in s:
              marker='@Composable fun RankRow(name: String, score: String) {'
              insert='''@Composable
          fun ChallengeRow(title: String, score: String, onBuzz: () -> Unit) {
              Card(
                  colors = CardDefaults.cardColors(containerColor = Surface),
                  shape = RoundedCornerShape(18.dp),
                  modifier = Modifier.fillMaxWidth()
              ) {
                  Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Text(title, fontWeight = FontWeight.Bold)
                          Text("النتيجة: $score", color = Color.Gray, fontSize = 12.sp)
                      }
                      FilledTonalButton(onClick = onBuzz) {
                          Icon(Icons.Default.Bolt, contentDescription = null)
                          Spacer(Modifier.width(5.dp))
                          Text("Buzz")
                      }
                  }
              }
          }

          '''
              if marker not in s:
                  raise SystemExit("ChallengeRow insertion marker missing")
              s=s.replace(marker,insert+marker,1)
          main.write_text(s)

          gradle=Path("app/build.gradle.kts")
          s=gradle.read_text()
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s=s.replace("    buildFeatures {", "    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n    buildFeatures {", 1)
          if "jvmToolchain(17)" not in s:
              s += "\n\nkotlin {\n    jvmToolchain(17)\n}\n"
          gradle.write_text(s)
          PY

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleRelease
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)
          test -n "$APK"
          test -s "$APK"
          cp "$APK" Mawja-V25-release.apk
          sha256sum Mawja-V25-release.apk | tee Mawja-V25-release.apk.sha256
          unzip -tq Mawja-V25-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-V25-release
          path: |
            Mawja-V25-release.apk
            Mawja-V25-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

name: Mawja V25 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact Mawja V25 source
        shell: bash
        run: |
          set -euo pipefail
          test -d .mawja-source
          cat .mawja-source/raw-01.b64               .mawja-source/raw-02.b64               .mawja-source/raw-03.b64               .mawja-source/raw-04.b64               .mawja-source/raw-05.b64               .mawja-source/raw-06.b64               .mawja-source/raw-07.b64               > Mawja-Native-V25-Deep-Review-Source.b64
          python3 - <<'PY'
          import base64, hashlib
          s=open("Mawja-Native-V25-Deep-Review-Source.b64","rb").read()
          s=b"".join(s.split())
          assert len(s)==46252, len(s)
          raw=base64.b64decode(s, validate=True)
          got=hashlib.sha256(raw).hexdigest()
          expected="41d0352980313a932652af1d1d13243ca52fd26a29ad9c8ad15a7e4e810f5bc6"
          print("BASE64_LENGTH=",len(s))
          print("ZIP_BYTES=",len(raw))
          print("ZIP_SHA256=",got)
          if got != expected:
              raise SystemExit(f"ZIP SHA256 mismatch: expected {expected}, got {got}")
          open("Mawja-Native-V25-Deep-Review-Source.zip","wb").write(raw)
          PY
          unzip -tq Mawja-Native-V25-Deep-Review-Source.zip
          rm -rf mawja-source
          mkdir -p mawja-source
          unzip -q -o Mawja-Native-V25-Deep-Review-Source.zip -d mawja-source
          rsync -a mawja-source/ ./
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Upgrade compileSdk for current dependencies
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/compileSdk = 35/compileSdk = 36/' app/build.gradle.kts
          grep -n 'compileSdk' app/build.gradle.kts

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleRelease
          APK=$(find . -type f -path '*/build/outputs/apk/release/*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          cp "$APK" Mawja-V25-release.apk
          sha256sum Mawja-V25-release.apk | tee Mawja-V25-release.apk.sha256
          unzip -tq Mawja-V25-release.apk
          ls -lh Mawja-V25-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-V25-release
          path: |
            Mawja-V25-release.apk
            Mawja-V25-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.5.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Mawja-V25-release.apk Mawja-V25-release.apk.sha256 --clobber
          else
            gh release create "$TAG" Mawja-V25-release.apk Mawja-V25-release.apk.sha256               --target "${GITHUB_SHA}"               --title "Mawja V25 (2.5.0)"               --notes "Mawja V25 native Android release. versionCode=25, versionName=2.5.0."
          fi

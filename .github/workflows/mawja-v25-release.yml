name: Mawja V25 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct V25 source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          expected = "f4c0b830a2e9c3ab7dc73a56e987ce60a9fd7a39477fa5d28c7fda75b036455f"
          parts = sorted(Path(".mawja-source").glob("part*.b64"))
          assert [p.name for p in parts] == [f"part{i:02d}.b64" for i in range(1, 10)], parts
          encoded = "".join(p.read_text(encoding="utf-8").strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(raw).hexdigest()
          print(f"parts={len(parts)} base64_chars={len(encoded)} bytes={len(raw)}")
          print(f"sha256={actual}")
          if actual != expected:
              raise SystemExit(f"SHA256 mismatch: expected {expected}, got {actual}")
          Path("Mawja-Native-V25-Deep-Review-Source.zip").write_bytes(raw)
          PY

          unzip -tq Mawja-Native-V25-Deep-Review-Source.zip
          rm -rf .mawja-build-source
          mkdir -p .mawja-build-source
          unzip -q Mawja-Native-V25-Deep-Review-Source.zip -d .mawja-build-source
          rsync -a .mawja-build-source/ ./

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleRelease
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Mawja-V25-release.apk
          sha256sum Mawja-V25-release.apk | tee Mawja-V25-release.apk.sha256
          ls -lh Mawja-V25-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mawja-V25-release
          path: |
            Mawja-V25-release.apk
            Mawja-V25-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.5.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Mawja-V25-release.apk Mawja-V25-release.apk.sha256 --clobber
          else
            gh release create "$TAG" Mawja-V25-release.apk Mawja-V25-release.apk.sha256               --title "Mawja V25 (2.5.0)"               --target "${GITHUB_SHA}"               --notes "Mawja V25 native Android release. versionCode=25, versionName=2.5.0."
          fi
